name: Update Visitor Total

# Reads the public MapMyVisitors stats page (the "Total Pageviews" figure) and
# publishes it to the `visitor-stats` branch, where the profile rail fetches it.
# Kept off `main` so the daily refresh never adds commits to the site history.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'
  push:
    branches:
      - main
    paths:
      - .github/workflows/visitor-total.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Fetch total pageviews
        run: |
          mkdir -p ./visitor_stats
          cd ./visitor_stats
          python3 - <<'EOF'
          import datetime
          import json
          import re
          import urllib.request

          STATS_URL = "https://mapmyvisitors.com/web/1c9ow"
          request = urllib.request.Request(
              STATS_URL,
              headers={"User-Agent": "Mozilla/5.0 (compatible; yinwenok.github.io visitor total)"},
          )
          html = urllib.request.urlopen(request, timeout=30).read().decode("utf-8", "ignore")

          match = re.search(r'total-pageviews[^>]*data-value="([\d,]+)"', html)
          if not match:
              raise SystemExit("Total Pageviews not found on the stats page")

          payload = {
              "total_pageviews": int(match.group(1).replace(",", "")),
              "updated": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
          }
          with open("visitor_total.json", "w", encoding="utf-8") as fh:
              json.dump(payload, fh, indent=2)
          print(payload)
          EOF

      - name: Publish to visitor-stats branch
        run: |
          cd ./visitor_stats
          git init
          git config --local user.name "${GITHUB_ACTOR}"
          git config --local user.email "${GITHUB_ACTOR}@users.noreply.github.com"
          export remote_repo="https://${GITHUB_ACTOR}:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git"
          git add visitor_total.json
          git commit -m "Update visitor total"
          git push "${remote_repo}" HEAD:visitor-stats --force
